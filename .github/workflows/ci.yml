name: CI

# Runs only when dispatched (no push/pull_request triggers).
# Dispatch before merging: gh workflow run ci.yml --repo hellojamison/notes-graph-kit --ref <branch>
# Minimal-CI policy, 2026-10-21.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run notes:search:eval
      - run: npm run notes:context:eval
      - run: npm run notes:stats -- --baseline notes-stats-baseline.json
      - run: npm run notes:validate
      - run: git diff --check
      - run: npm audit --omit=dev
