name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run notes:search:eval
      - run: npm run notes:context:eval
      - run: npm run notes:stats -- --baseline notes-stats-baseline.json
      - run: npm run notes:validate
      - run: git diff --check
      - run: npm audit --omit=dev
